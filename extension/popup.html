<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dropwatch</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 320px;
        background: #0d0d0f;
        color: #f5f5f5;
        font: 13px Inter, system-ui, sans-serif;
      }
      .wrap { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      p { color: #a1a1aa; line-height: 1.45; }
      input, button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        font: inherit;
      }
      input {
        background: #0a0a0c;
        border: 1px solid rgba(255,255,255,.12);
        color: #f5f5f5;
        padding: 8px 10px;
        margin: 8px 0;
      }
      button {
        background: #4f8cff;
        color: #06101f;
        border: 0;
        font-weight: 600;
        padding: 9px 10px;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: #f5f5f5;
        border: 1px solid rgba(255,255,255,.14);
        margin-top: 8px;
      }
      .item { padding: 8px 0; border-top: 1px solid rgba(255,255,255,.08); }
      .price { font-weight: 700; }
      .err { color: #ff5c7a; }
      .ok { color: #00d97e; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Dropwatch</h1>
      <div id="root">Loading…</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
